version: '3.8'

services:
  stock-scraper:
    build:
      context: .
      secrets:
        - gh_pat
    container_name: stock-data-scraper
    environment:
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - CONTAINER_ENV=true
      - db_url=${db_url}
      - nasdaq_scraping_url=${nasdaq_scraping_url}
      - proxy_url=${proxy_url}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

secrets:
  gh_pat:
    environment: GH_PAT
